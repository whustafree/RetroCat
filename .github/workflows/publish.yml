name: Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # settings.gradle.kts includes ":bundled-cores" -> lemuroid-cores/bundled-cores
      # unconditionally, so the folder has to exist or Gradle cannot configure the build.
      # This repo has no .gitmodules, so checkout cannot fetch it. The upstream repo is
      # ~1 GB, but the freeDynamic flavor only needs ":bundled-cores" to be configured,
      # never assembled, so a partial (sparse) clone of that folder is enough.
      - name: Clone the emulator cores
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Swordfish90/LemuroidCores.git lemuroid-cores
          git -C lemuroid-cores sparse-checkout set bundled-cores

      # The release keystore is stored base64 encoded in a secret (never in the repo).
      - name: Recreate the release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.jks

      # assembleFreeDynamic also builds the "benchmark" variant, whose build type
      # is signed with the debug signing config, so debug.keystore has to exist
      # (it is gitignored on purpose).
      - name: Create the debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Assemble Artifact
        env:
          RETROCAT_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RETROCAT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleFreeDynamic --console=plain

      - name: Prepare the APK asset
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk "dist/RetroCat-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish on apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RetroCat (última APK)
          files: dist/*.apk

      - name: Publish the version release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          name: RetroCat ${{ github.ref_name }}
          files: dist/*.apk
